<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AnsarOS Навигатор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky brand bar (level crumbs + period) → context bar (filters, back) → main column: verdict card, KPI row, charts, driver tables. Palette = AnsarOS/Word brand blues. */
:root{
  --brand:#1F4E78; --brand-2:#2E6A9E; --brand-soft:#EAF1F8; --brand-ink:#ffffff;
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#F6F9FC; --line:#DCE4EE; --line-2:#C7D3E1;
  --ink:#0F2236; --ink-2:#3F5670; --muted:#6D8199;
  --good:#17804B; --good-bg:#E2F3EA; --warn:#A76A00; --warn-bg:#FBF0D8; --bad:#C23A31; --bad-bg:#FBE4E1; --na:#9AA9BA;
  --c-access:#1F4E78; --c-techno:#2F8F83; --c-bijou:#B8527A; --c-prev:#B9C8D8; --c-plan:#8A99AB; --grid:#E6ECF3;
  --tip-bg:#0F2236; --tip-fg:#F2F5F9; --top:#1F4E78;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#7FB0E0; --brand-2:#A2C7EC; --brand-soft:#16283B; --brand-ink:#0B1621;
  --bg:#0B131C; --surface:#121D29; --surface-2:#172433; --line:#22344A; --line-2:#30465F;
  --ink:#E5EDF6; --ink-2:#B1C1D3; --muted:#8196AE;
  --good:#4CC486; --good-bg:#12321F; --warn:#E3AA3E; --warn-bg:#382A10; --bad:#F07368; --bad-bg:#3C1B19; --na:#5C6F85;
  --c-access:#7FB0E0; --c-techno:#4FC2B3; --c-bijou:#E58BAE; --c-prev:#34506D; --c-plan:#7C8DA2; --grid:#1B2A3A;
  --tip-bg:#E5EDF6; --tip-fg:#0B131C; --top:#0E1F31; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#7FB0E0; --brand-2:#A2C7EC; --brand-soft:#16283B; --brand-ink:#0B1621;
  --bg:#0B131C; --surface:#121D29; --surface-2:#172433; --line:#22344A; --line-2:#30465F;
  --ink:#E5EDF6; --ink-2:#B1C1D3; --muted:#8196AE;
  --good:#4CC486; --good-bg:#12321F; --warn:#E3AA3E; --warn-bg:#382A10; --bad:#F07368; --bad-bg:#3C1B19; --na:#5C6F85;
  --c-access:#7FB0E0; --c-techno:#4FC2B3; --c-bijou:#E58BAE; --c-prev:#34506D; --c-plan:#7C8DA2; --grid:#1B2A3A;
  --tip-bg:#E5EDF6; --tip-fg:#0B131C; --top:#0E1F31; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.num,td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--top);color:#fff;padding-block:10px;padding-inline:clamp(16px,2.6vw,36px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;color:#fff;border:0;background:none;padding:0}
.logo i{font-style:normal;opacity:.55;font-weight:500}
.logo small{font-size:11.5px;font-weight:500;opacity:.7;font-family:var(--mono)}
.cos{display:flex;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.cos button{border:0;background:none;color:#fff;opacity:.8;padding:6px 12px;border-radius:8px;font-size:13.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.cos button:hover{opacity:1;background:rgba(255,255,255,.08)}
.cos button[aria-pressed="true"]{background:#fff;color:#1F4E78;opacity:1;font-weight:600}
.cos .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tctl select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 8px;font-size:13px;max-width:100%}
.tctl select option{color:#0F2236;background:#fff}
.tctl label{font-size:12.5px;color:#fff;opacity:.85;display:flex;gap:6px;align-items:center;white-space:nowrap}

.ctx{background:var(--surface);border-bottom:1px solid var(--line);padding-block:9px;padding-inline:clamp(16px,2.6vw,36px);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:25}
.back{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--brand);font-weight:600;white-space:nowrap}
.back:disabled{opacity:.4;cursor:default}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;min-width:0}
.crumbs button{border:0;background:none;padding:2px 4px;border-radius:5px;color:var(--brand);font-weight:500}
.crumbs button:hover{background:var(--brand-soft)}
.crumbs .cur{font-weight:700;color:var(--ink);padding:2px 4px}
.crumbs .sep{color:var(--muted)}
.crumbs small{color:var(--muted);font-size:11px;margin-right:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:14px;padding:2px 4px 2px 10px;font-size:12px;color:var(--ink)}
.chip b{font-weight:600;color:var(--muted);font-size:11px}
.chip button{border:0;background:var(--surface);border-radius:50%;width:18px;height:18px;line-height:18px;padding:0;color:var(--muted)}
.chip.per{padding-right:10px;background:var(--brand-soft);border-color:transparent}

main{padding-block:18px 70px;padding-inline:clamp(16px,2.6vw,36px);min-width:0;max-width:1480px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.head h1{font-size:24px;letter-spacing:-.02em;font-weight:800}
.head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;border-bottom:2px solid transparent;padding:8px 12px;font-size:13.5px;color:var(--ink-2);margin-bottom:-1px}
.tabs button:hover{color:var(--brand)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--brand);color:var(--brand);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:16px;padding:4px 12px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg button .c{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{font-size:14.5px;font-weight:600}
.panel .sub{margin:2px 0 12px;color:var(--muted);font-size:12.5px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec h2{font-size:16px;letter-spacing:-.01em}
.sec p{margin:0;color:var(--muted);font-size:12.5px}
.more{border:0;background:none;color:var(--brand);font-size:12.5px;padding:0;font-weight:500}

/* verdict: что произошло → почему → что будет → что делать */
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}
.verdict>div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.verdict>div:first-child{border-left:0}
.verdict h4{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand);font-weight:700;display:flex;gap:6px;align-items:center}
.verdict h4 i{font-style:normal;font-family:var(--mono);background:var(--brand-soft);border-radius:5px;padding:0 5px;font-weight:600}
.verdict p{margin:0 0 6px;font-size:13.5px}
.verdict ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.verdict li{font-size:13px}
.lnk{border:0;background:none;padding:0;color:var(--brand);font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--brand)}
.act{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 9px;width:100%;text-align:left;font-size:12.5px;color:var(--ink)}
.act:hover{border-color:var(--brand-2)}
.act .pill{flex:none;margin-top:1px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 18px;min-width:0;text-align:left;width:100%}
.kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--na)}
.kpi.g::before{background:var(--good)}.kpi.y::before{background:var(--warn)}.kpi.r::before{background:var(--bad)}
.kpi .k{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.03em;margin:3px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;color:var(--muted)}
button.kpi:hover{border-color:var(--brand-2)}
button.kpi .go{position:absolute;right:10px;bottom:9px;color:var(--brand);font-size:12px;opacity:0}
button.kpi:hover .go,button.kpi:focus-visible .go{opacity:1}
.up{color:var(--good)}.dn{color:var(--bad)}.fl{color:var(--muted)}
.delta{font-family:var(--mono);font-size:12px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill.g{background:var(--good-bg);color:var(--good)}.pill.y{background:var(--warn-bg);color:var(--warn)}.pill.r{background:var(--bad-bg);color:var(--bad)}.pill.n{background:var(--surface-2);color:var(--muted)}
.lim{background:var(--warn-bg);border-radius:10px;padding:9px 13px;font-size:12.5px;color:var(--ink);margin:10px 0}
.lim b{color:var(--warn)}
.note{font-size:12px;color:var(--muted)}
.nd{font-size:12px;color:var(--warn);font-weight:600;white-space:nowrap}
.empty{padding:18px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);font-size:13px}

/* plan bar */
.plan{display:flex;flex-direction:column;gap:8px}
.ptrack{position:relative;height:26px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.ptrack .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--brand)}
.ptrack .fc{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--brand-2) 0 5px,transparent 5px 10px);opacity:.45}
.ptrack .mk{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--warn)}
.prow{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12.5px;color:var(--ink-2)}
.prow b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.l{white-space:normal;min-width:160px;max-width:340px}
td.n{font-size:12.5px}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td,tr.click:focus-visible td{background:var(--brand-soft)}
tr.click td:first-child{color:var(--brand);font-weight:500}
tr.tot td{font-weight:700;background:var(--surface-2)}
td .sm{display:block;font-size:11px;color:var(--muted);font-weight:400}
.cbar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle}
.cbar.pos{background:var(--good)}.cbar.neg{background:var(--bad)}
.sbar{display:inline-block;height:6px;border-radius:3px;background:var(--brand);opacity:.7;vertical-align:middle;margin-left:6px}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tool input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;min-width:0;width:min(320px,100%)}

/* charts */
svg{display:block;max-width:100%;height:auto}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;vertical-align:3px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.4;max-width:280px}
.hit{cursor:pointer}

.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.why div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.why b{display:block;font-size:16px;font-family:var(--mono);color:var(--ink);font-weight:600}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

.drawer{position:fixed;inset:0;z-index:60}
.drawer .scrim{position:absolute;inset:0;background:rgba(8,20,34,.45)}
.drawer .pane{position:absolute;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--bg);overflow:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-bottom,0px));padding-inline:20px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.x{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;width:32px;height:32px;font-size:16px;color:var(--ink-2);flex:none}
.loading{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:40px 0;color:var(--muted)}
.foot{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.foot ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}

@media (max-width:1100px){.g32,.g4{grid-template-columns:1fr 1fr}.verdict{grid-template-columns:1fr 1fr}.verdict>div:nth-child(3){border-left:0}.verdict>div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:860px){.top,.ctx{position:static}.tctl{margin-left:0}.g2,.g3,.g32,.g4{grid-template-columns:1fr}.chips{margin-left:0}}
@media (max-width:560px){.verdict{grid-template-columns:1fr}.verdict>div{border-left:0;border-top:1px solid var(--line)}.verdict>div:first-child{border-top:0}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:18px}}

.tbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;white-space:nowrap}
.tbtn.ai{background:#fff;color:#1F4E78;border-color:#fff;font-weight:600}
.wrap{padding-block:0 34px;padding-inline:clamp(16px,2.6vw,36px);max-width:1480px;margin:0 auto}
#gloss{border-top:1px solid var(--line);padding-top:28px}
.gl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.gli{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.gli summary{cursor:pointer;padding:10px 14px;display:flex;flex-direction:column;gap:2px;list-style:none}
.gli summary::-webkit-details-marker{display:none}
.gli summary b{font-size:13.5px;color:var(--brand);display:flex;justify-content:space-between;gap:8px}
.gli summary b::after{content:"+";color:var(--muted);font-weight:400}
.gli[open] summary b::after{content:"−"}
.gli summary span{font-size:12.5px;color:var(--ink-2)}
.gli dl{margin:0;padding:0 14px 12px;display:grid;gap:4px;font-size:12.5px}
.gli dt{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:4px}
.gli dd{margin:0}
.aip{border-left:4px solid var(--brand)}
.qs{display:flex;flex-wrap:wrap;gap:6px}
.qs button{border:1px dashed var(--line-2);background:none;border-radius:14px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
.qs button:hover{border-color:var(--brand);color:var(--brand)}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.chat:empty{display:none}
.msg{padding:10px 13px;border-radius:12px;max-width:900px;font-size:13.5px;line-height:1.5;min-width:0}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.u small{display:block;opacity:.75;font-size:11px;margin-top:3px}
.msg.a{background:var(--surface-2);border:1px solid var(--line)}
.msg p{margin:0 0 6px}.msg ul{margin:0 0 6px;padding-left:18px}.msg h5{margin:6px 0 4px;font-size:13px}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;resize:vertical;min-height:44px;font:inherit;color:var(--ink)}
.askb{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--brand);font-weight:600;white-space:nowrap}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.5}
@media (max-width:860px){.gl{grid-template-columns:1fr}}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:8px;padding:2px}
.lang button{border:0;background:none;color:#fff;opacity:.75;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600}
.lang button[aria-pressed="true"]{background:#fff;color:#1F4E78;opacity:1}
.tbtn.icon{min-width:34px;font-size:15px;line-height:1;padding:5px 8px}
</style>

<header class="top">
  <button class="logo" id="home" aria-label="К группе компаний">Ansar<i>OS</i><small id="asof"></small></button>
  <div class="cos" id="cos" role="group" aria-label="Компания"></div>
  <div class="tctl">
    <select id="per" aria-label="Период"></select>
    <select id="cmp" aria-label="Сравнение"></select>
    <label><input type="checkbox" id="inc"> внутренние</label>
    <button class="tbtn ai" id="btn-ai" type="button">Спросить AI</button>
  </div>
